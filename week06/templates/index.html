<html>
    <head>
        <link
            rel="stylesheet"
            href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
            integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <div class="gameResult"></div>
        <div id="myBoard" style="width: 400px"></div>
        <button class="startBtn">start</button>
        <button class="restartBtn">Restart</button>

        <script
            src="https://code.jquery.com/jquery-3.5.1.min.js"
            integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"
            integrity="sha384-8Vi8VHwn3vjQ9eUHUxex3JSN/NFqUg3QbPyX8kWyb93+8AC/pPWTzj+nHtbC5bxD"
            crossorigin="anonymous"
        ></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

        <script>
            // Great https://chessboardjs.com/examples#5001
            let board = null;
            let game = new Chess();
            let role;

            const startBtn = document.querySelector(".startBtn");
            const restartBtn = document.querySelector(".restartBtn");
            restartBtn.addEventListener("click", async () => {
                const response = await fetch("/reset", {
                    method: "PUT",
                });
                window.location.reload(); // just F5 for simplicity
            });
            const gameResultQuote = document.querySelector(".gameResult");

            let interval;

            function onDragStart(source, piece, position, orientation) {
                // do not pick up pieces if the game is over
                if (game.game_over()) return false;

                // only pick up pieces for White
                if (piece.search(/^"{{your_role}}"/) !== -1) return false;
            }

            function checkGameOver(data) {
                if (data?.game_result) {
                    console.log("GAME FINE");
                    gameResultQuote.innerHTML = `${data?.game_result}`;
                    if (interval) {
                        clearInterval(interval);
                    }
                }
            }

            async function fetchMove() {
                const history = game.history({ verbose: true }); // uci + san

                const body = {
                    history,
                    self_play: "{{self_play}}",
                };
                const response = await fetch("/move", {
                    body: JSON.stringify(body),
                    headers: { "Content-Type": "application/json" },
                    method: "PUT",
                });
                const data = await response.json();
                game.move(data.move);
                board.position(game.fen());
                checkGameOver(data);
            }

            function onDrop(source, target) {
                // see if the move is legal
                var move = game.move({
                    from: source,
                    to: target,
                    promotion: "q", // NOTE: always promote to a queen for example simplicity
                });
                if (move === null) return "snapback";
                fetchMove();
            }

            // update the board position after the piece snap
            // for castling, en passant, pawn promotion
            function onSnapEnd() {
                board.position(game.fen());
            }

            let config = {
                draggable: "{{self_play}}" != "1",
                position: "start",
                pieceTheme: "https://koblenski.github.io/javascript/chessboardjs-0.3.0/img/chesspieces/wikipedia/{piece}.png",
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
            };
            board = Chessboard("myBoard", config);

            if ("{{self_play}}" != "1") {
                startBtn.remove(); // if we don't need any start btn
            }

            startBtn.addEventListener("click", () => {
                interval = setInterval(fetchMove, 250);
                startBtn.remove();
            });

            if ("{{your_role}}" == "b") {
                board.flip();
                fetchMove();
            }
        </script>
    </body>
</html>
